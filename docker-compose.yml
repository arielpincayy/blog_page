version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_blogpage
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: terrioco22verde701*
      POSTGRES_DB: blogdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: blogpage_flask_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend/:/app
    environment:
      - FLASK_ENV=production
      - JWT_SECRET_KEY=pepepopeyemarino145*84643@111!!1561fwfoimn5665ve1
      - DATABASE_URL=postgresql://postgres:terrioco22verde701*@db:5432/blogdb
    depends_on:
      - db

  # Frontend Next.js
  frontend:
    build: ./frontend
    container_name: blogpage_next_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app  # Hot reload
      - /app/node_modules # Evita conflictos con node_modules locales
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_PAGE_URL=http://localhost:3000
    command: npm run dev
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: blogpage_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
